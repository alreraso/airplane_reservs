spring.application.name=reservations

# --- Database: in-memory H2, recreated on every start (see docs/shared/decisions.md to switch to PostgreSQL)
spring.datasource.url=jdbc:h2:mem:reservations;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# Keep DB connections out of the view layer: prevents lazy-loading surprises and long-held connections
spring.jpa.open-in-view=false

# --- Seat hold rules
# How long a seat stays blocked while the customer fills in payment data
reservations.hold-duration=5m
# How often the job looks for expired holds (milliseconds)
reservations.expiration-check-ms=1000

# --- Frontend: serve the static files from ../frontend so one command runs everything
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
